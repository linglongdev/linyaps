name: Update release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"
jobs:
  obs_release_deepin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get latest release branch
        id: detect_branch
        run: |
          TARGET_BRANCH=$(git ls-remote --heads https://github.com/deepin-community/linyaps | grep 'release/[0-9]\.' | awk -F'/' '{print $NF}' | sort -V | tail -n 1)
          echo "target_branch=${TARGET_BRANCH}" >> $GITHUB_OUTPUT

      - run: |
          git remote add deepin https://github.com/deepin-community/linyaps
          git remote add openatom https://github.com/OpenAtom-Linyaps/linyaps
          git fetch deepin --no-tags
          git fetch openatom --no-tags
          git reset --hard deepin/release/${{ steps.detect_branch.outputs.target_branch }}
          rm -r .github || true

      - name: Restore third-party libraries from upstream
        run: |
          # deepin-community 的 release 分支删除了 external 下的三方库
          # （fmt、CLI11、tl-expected 等），这里从上游对应的 release 分支恢复
          upstream_ref="openatom/release/${{ steps.detect_branch.outputs.target_branch }}"
          if ! git rev-parse --verify --quiet "${upstream_ref}" > /dev/null; then
            echo "::warning::${upstream_ref} 不存在，改用 openatom/master 恢复三方库"
            upstream_ref="openatom/master"
          fi
          git diff --no-renames --name-only --diff-filter=D "${upstream_ref}" HEAD -- external |
            while read -r file; do
              git checkout "${upstream_ref}" -- "${file}"
            done

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: obs_release_deepin
          create_branch: true
          push_options: --force
          commit_message: Automated Change

  obs_release_uos20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get latest release branch
        id: detect_branch
        run: |
          TARGET_BRANCH=$(git ls-remote --heads https://github.com/deepin-community/linyaps | grep 'release/[0-9]\.' | awk -F'/' '{print $NF}' | sort -V | tail -n 1)
          echo "target_branch=${TARGET_BRANCH}" >> $GITHUB_OUTPUT

      - run: |
          git remote add deepin https://github.com/deepin-community/linyaps
          git remote add openatom https://github.com/OpenAtom-Linyaps/linyaps
          git fetch deepin --no-tags
          git fetch openatom --no-tags
          git reset --hard deepin/release/${{ steps.detect_branch.outputs.target_branch }}
          rm -r .github || true

      - name: Restore third-party libraries from upstream
        run: |
          # deepin-community 的 release 分支删除了 external 下的三方库
          # （fmt、CLI11、tl-expected 等），这里从上游对应的 release 分支恢复
          upstream_ref="openatom/release/${{ steps.detect_branch.outputs.target_branch }}"
          if ! git rev-parse --verify --quiet "${upstream_ref}" > /dev/null; then
            echo "::warning::${upstream_ref} 不存在，改用 openatom/master 恢复三方库"
            upstream_ref="openatom/master"
          fi
          git diff --no-renames --name-only --diff-filter=D "${upstream_ref}" HEAD -- external |
            while read -r file; do
              git checkout "${upstream_ref}" -- "${file}"
            done

      - run: |
          # 禁止单元测试
          sed -i '/set(ENABLE_TESTING/{n; s/ON/OFF/}' CMakeLists.txt

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: obs_release_uos20
          create_branch: true
          push_options: --force
          commit_message: Automated Change

  obs_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get latest release branch
        id: detect_branch
        run: |
          TARGET_BRANCH=$(git ls-remote --heads https://github.com/deepin-community/linyaps | grep 'release/[0-9]\.' | awk -F'/' '{print $NF}' | sort -V | tail -n 1)
          echo "target_branch=${TARGET_BRANCH}" >> $GITHUB_OUTPUT

      - run: |
          git remote add deepin https://github.com/deepin-community/linyaps
          git remote add openatom https://github.com/OpenAtom-Linyaps/linyaps
          git fetch deepin --no-tags
          git fetch openatom --no-tags
          git reset --hard deepin/release/${{ steps.detect_branch.outputs.target_branch }}
          rm -r .github || true

      - name: Restore third-party libraries from upstream
        run: |
          # deepin-community 的 release 分支删除了 external 下的三方库
          # （fmt、CLI11、tl-expected 等），这里从上游对应的 release 分支恢复
          upstream_ref="openatom/release/${{ steps.detect_branch.outputs.target_branch }}"
          if ! git rev-parse --verify --quiet "${upstream_ref}" > /dev/null; then
            echo "::warning::${upstream_ref} 不存在，改用 openatom/master 恢复三方库"
            upstream_ref="openatom/master"
          fi
          git diff --no-renames --name-only --diff-filter=D "${upstream_ref}" HEAD -- external |
            while read -r file; do
              git checkout "${upstream_ref}" -- "${file}"
            done

      - run: |
          # 删除patch
          rm -r debian/patches || true
          # 删除preloader相关的代码
          sed -i '/preloader/d' debian/linglong-bin.install
          sed -i '/preloader/c\echo skip preloader' debian/linglong-bin.postinst
          # 删除config.json
          sed -i '\#etc/linglong/config.json#d' debian/linglong-bin.install
          # 禁止单元测试
          sed -i '/set(ENABLE_TESTING/{n; s/ON/OFF/}' CMakeLists.txt

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: obs_release
          create_branch: true
          push_options: --force
          commit_message: Automated Change
